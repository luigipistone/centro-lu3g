name: Diagnose production response

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Summarize server errors without request data
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PLESK_HOST }}
          username: ${{ secrets.PLESK_USER }}
          key: ${{ secrets.PLESK_SSH_KEY }}
          port: 22
          script: |
            for log in \
              /var/www/vhosts/lu3g.com/centro.lu3g.com/storage/logs/laravel.log \
              /var/www/vhosts/lu3g.com/logs/proxy_error_log \
              /var/www/vhosts/lu3g.com/logs/error_log \
              /var/www/vhosts/lu3g.com/logs/php_error.log; do
              if [ ! -r "$log" ]; then
                printf 'unavailable: %s\n' "$(basename "$log")"
                continue
              fi
              printf 'log: %s\n' "$(basename "$log")"
              tail -n 3000 "$log" | awk '
                /Allowed memory size|memory exhausted|Out of memory/ { memory++ }
                /Maximum execution time|timed out|timeout|upstream timed out/ { timeout++ }
                /upstream prematurely closed|connection reset by peer/ { closed++ }
                /upstream sent too big header/ { header++ }
                /SQLSTATE|QueryException/ { database++ }
                /production.ERROR|production.CRITICAL|PHP Fatal error/ { application++ }
                END { printf "memory=%d timeout=%d upstream_closed=%d header=%d database=%d application=%d\n", memory, timeout, closed, header, database, application }
              '
              if [ "$(basename "$log")" = 'laravel.log' ]; then
                tail -n 3000 "$log" | awk '
                  /production.ERROR|production.CRITICAL/ {
                    day = substr($0, 2, 10)
                    category = /Allowed memory size|memory exhausted/ ? "memory" : (/SQLSTATE|QueryException/ ? "database" : "other")
                    print day, category
                  }
                ' | tail -n 15
                tail -n 3000 "$log" | grep -E 'Allowed memory size|memory exhausted' | tail -n 2 | sed -E 's/^\[([^]]+)\].*/memory_event=\1/' || true
              fi
            done
            for log in /var/www/vhosts/lu3g.com/logs/proxy_access_ssl_log /var/www/vhosts/lu3g.com/logs/proxy_access_log; do
              if [ -r "$log" ]; then
                tail -n 5000 "$log" | awk '
                  /" (502|504) / {
                    total++
                    if ($0 ~ /\/users\//) users++
                    if ($0 ~ /\/tasks\//) tasks++
                  }
                  END { printf "bad_gateway_total=%d users=%d tasks=%d\n", total, users, tasks }
                '
              fi
            done
            cd /var/www/vhosts/lu3g.com/centro.lu3g.com
            /opt/plesk/php/8.3/bin/php <<'PHP'
            <?php
            require 'vendor/autoload.php';
            $app = require 'bootstrap/app.php';
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $viewerId = Illuminate\Support\Facades\DB::table('user_roles')->where('role', 'superadmin')->value('user_id');
            $viewer = $viewerId ? App\Models\User::find($viewerId) : null;
            if (! $viewer) { echo "profile_probe=unavailable\n"; exit; }
            $targetIds = Illuminate\Support\Facades\DB::table('user_roles')->whereIn('role', ['superadmin', 'editor'])->limit(3)->pluck('user_id');
            foreach ($targetIds as $index => $id) {
                $request = Illuminate\Http\Request::create('/users/'.$id, 'GET');
                $request->setUserResolver(fn () => $viewer);
                $route = app('router')->getRoutes()->match($request);
                $request->setRouteResolver(fn () => $route);
                $start = microtime(true);
                try {
                    $response = app(App\Http\Controllers\CentroPageController::class)->show($request, $id)->toResponse($request);
                    echo 'profile_probe='.($index + 1).' status='.$response->getStatusCode().' bytes='.strlen($response->getContent()).' seconds='.round(microtime(true) - $start, 2).' peak_mb='.round(memory_get_peak_usage(true) / 1048576)."\n";
                } catch (Throwable $error) {
                    echo 'profile_probe='.($index + 1).' error='.get_class($error)."\n";
                }
            }
            PHP
            for dir in /var/www/vhosts/lu3g.com/logs /var/www/vhosts/system/centro.lu3g.com/logs; do
              if [ -d "$dir" ]; then
                printf 'log_directory=%s\n' "$(basename "$(dirname "$dir")")"
                find "$dir" -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | head -n 30
              fi
            done
