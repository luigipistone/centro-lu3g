name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: centro-lu3g-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PLESK_HOST: ${{ secrets.PLESK_HOST }}
      PLESK_USER: ${{ secrets.PLESK_USER }}
      PLESK_SSH_KEY: ${{ secrets.PLESK_SSH_KEY }}

    steps:
      - name: Check deployment secrets
        if: ${{ env.PLESK_HOST == '' || env.PLESK_USER == '' || env.PLESK_SSH_KEY == '' }}
        run: |
          echo "Deployment skipped: configure PLESK_HOST, PLESK_USER and PLESK_SSH_KEY secrets."

      - name: Deploy on Plesk
        if: ${{ env.PLESK_HOST != '' && env.PLESK_USER != '' && env.PLESK_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PLESK_HOST }}
          username: ${{ secrets.PLESK_USER }}
          key: ${{ secrets.PLESK_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            bash /var/www/vhosts/lu3g.com/centro.lu3g.com/scripts/deploy-production.sh
